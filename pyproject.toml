[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-schema-tool"
version = "0.2.0"
description = "Evidence-first custom URL Scheme and deep-route inspector for mobile apps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Compy research tooling"}]
dependencies = []

[project.scripts]
app-schema = "appschema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
